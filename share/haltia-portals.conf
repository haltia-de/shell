# xdg-desktop-portal for Haltia (XDG_CURRENT_DESKTOP=Haltia:GNOME): the GTK
# portal for file choosers, opening links and the like, wlroots' for
# screenshots and screen casts (phoc speaks wlr-screencopy); the file
# chooser is Haltia's own (haltia-files --portal), GTK's where Файлы is not
# installed. Without xdg-desktop-portal the shell's haltia-portal stands in.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=haltia;gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
