# The system programs the shell shows that bring no X-B8K .desktop file of
# their own (Firefox, the calculator, the cards, the terminal, the touch
# settings, Settings),
# one section per id. Installed as /usr/local/share/b8k/apps.conf.
# Programs that do bring one are found by it (X-B8K-Home). b8k-apps merges
# this file, those .desktop files and ~/.config/b8k/apps.conf (one's own
# programs, same fields) into $XDG_RUNTIME_DIR/b8k/apps.conf, which
# b8k-launch, b8k-focus, b8k-ask and b8k-splash read. The buttons come from
# ~/.config/b8k/panel, else /usr/local/share/b8k/panel. See docs/shell.md.
#
#   label    the name on the panel button and in questions
#   icon     the picture on the button and in b8k-splash (PNG or SVG)
#   signal   above 0: wants a button; one not named in the panel file
#            goes below the others. b8k-apps renumbers the buttons by
#            their place on the panel
#   app_ids  the Wayland app_ids of its windows, space separated; none
#            for an entry that opens no window of its own (a menu)
#   exec     its command line, split on spaces (no quoting)
#   env      one VAR=value set for exec
#   home     no: not on the home screen

[firefox]
label = Firefox
icon = /usr/share/icons/hicolor/256x256/apps/firefox.png
signal = 1
app_ids = firefox Firefox org.mozilla.firefox
exec = firefox

[calc]
label = Калькулятор
icon = /usr/share/icons/hicolor/scalable/apps/galculator.svg
signal = 2
app_ids = galculator Galculator
exec = galculator
# galculator drops its button font on =, ( and ); this theme puts it back.
env = GTK_THEME=b8k-galculator

# Aisleriot, the GNOME solitaire collection (Alpine package), with a theme
# for fingers: no menu bar or title, a large toolbar and game chooser.
[cards]
label = Пасьянсы
icon = /usr/share/icons/hicolor/256x256/apps/gnome-aisleriot.png
signal = 3
app_ids = sol
exec = sol
env = GTK_THEME=b8k-cards

# In «Служебные», not on the panel or the home screen.
[term]
label = Терминал
icon = /usr/share/icons/hicolor/scalable/apps/foot.svg
signal = 0
app_ids = foot
exec = foot -c /usr/local/share/b8k/foot.ini /usr/local/bin/b8k-term
home = no

# The touch filter's settings, in «Служебные» and the power menu: for
# whoever looks after the tablet, not on the home screen.
[touch]
label = Касания
icon = /usr/share/icons/Adwaita/scalable/devices/input-tablet.svg
signal = 0
app_ids = b8k-touchguard-setup
exec = /usr/local/bin/b8k-touchguard-setup
home = no

# Opened by the Wi-Fi indicator and from «Служебные».
[settings]
label = Настройки
icon = /usr/share/icons/hicolor/scalable/apps/org.gnome.Settings.svg
signal = 0
app_ids = org.gnome.Settings gnome-control-center
exec = gnome-control-center
home = no

# The tile in their place on the home screen: a menu (b8k-ask service) of
# Settings, the touch settings, brightness and the terminal. No app_ids:
# it opens no window, so b8k-launch runs it without a curtain and the home
# screen stays up under it.
[service]
label = Служебные
icon = /usr/local/share/b8k/service.svg
signal = 0
exec = /usr/local/bin/b8k-ask service
