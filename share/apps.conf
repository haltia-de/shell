# The system programs the shell shows that bring no X-Haltia .desktop file of
# their own (Firefox, the calculator, the cards, the terminal, the touch
# settings, Settings),
# one section per id. Installed as /usr/share/haltia/apps.conf.
# Programs that do bring one are found by it (X-Haltia-Home). haltia-apps merges
# this file, those .desktop files and ~/.config/haltia/apps.conf (one's own
# programs, same fields) into $XDG_RUNTIME_DIR/haltia/apps.conf, which
# haltia-launch, haltia-focus, haltia-ask and haltia-splash read. The buttons come from
# ~/.config/haltia/panel, else /usr/share/haltia/panel. See docs/shell.md.
#
#   label    the name on the panel button and in questions
#   icon     the picture on the button and in haltia-splash (PNG or SVG)
#   signal   above 0: wants a button; one not named in the panel file
#            goes below the others. haltia-apps renumbers the buttons by
#            their place on the panel
#   app_ids  the Wayland app_ids of its windows, space separated; none
#            for an entry that opens no window of its own (a menu)
#   exec     its command line, split on spaces (no quoting)
#   env      one VAR=value set for exec
#   home     no: not on the home screen
#   back     none: a program not our own, with no app.back to tell its first
#            screen: the shell's home button at the top left always shows
#            over it (its theme or profile leaves that corner free)

[firefox]
label = Firefox
icon = /usr/share/icons/hicolor/256x256/apps/firefox.png
signal = 1
app_ids = firefox Firefox org.mozilla.firefox
exec = firefox
back = none

[calc]
label = Калькулятор
icon = /usr/share/haltia/calculator.svg
signal = 2
app_ids = galculator Galculator
exec = galculator
# galculator drops its button font on =, ( and ); this theme puts it back.
env = GTK_THEME=Haltia-Galculator
back = none

# Aisleriot, the GNOME solitaire collection (Alpine package), with a theme
# for fingers: no menu bar or title, a large toolbar and game chooser.
[cards]
label = Пасьянсы
icon = /usr/share/haltia/cards.svg
signal = 3
app_ids = sol
exec = sol
env = GTK_THEME=Haltia-Cards
back = none

# In Настройки → «Для помощника», not on the panel or the home screen.
[term]
label = Терминал
icon = /usr/share/haltia/terminal.svg
signal = 0
app_ids = foot
exec = foot -c /usr/share/haltia/foot.ini /usr/bin/haltia-term
home = no

# The touch filter's settings, a page of Настройки → «Для помощника» (and
# its own window still, for whoever opens it by name): not on the home
# screen.
[touch]
label = Касания
icon = /usr/share/haltia/touch.svg
signal = 0
app_ids = io.github.haltia_de.TouchSettings haltia-touch-settings b8k-touchguard-setup
exec = /usr/bin/haltia-touch-settings
home = no

# Everything one can set, on the home screen in the place of «Служебные»
# (shell 2.6), and opened by the status card's network item.
[settings]
label = Настройки
icon = /usr/share/haltia/settings.svg
signal = 0
app_ids = io.github.haltia_de.Settings haltia-settings
exec = /usr/bin/haltia-settings
