# haltia-touchguard: what counts as a deliberate touch. Installed as
# /etc/haltia/touchguard.conf; after a change: rc-service haltia-touchguard restart.
# Switched off altogether with: rc-service haltia-touchguard stop;
# rc-update del haltia-touchguard (back on: rc-update add haltia-touchguard
# sysinit; rc-service haltia-touchguard start).
#
# A touch counts once it has lasted this long (ms); a shorter brush of the
# glass is dropped. A finger's tap here lasts 75-120 ms.
#
# Sizes, pressures and distances are percent of what the screen reports
# (its largest contact, its highest pressure, its width), so they mean the
# same on any screen. The comments give the B8000-H's units (width 2230,
# size 15, pressure 255). A plain number is the old absolute value in the
# screen's units, read for now and converted.
hold_ms = 40
# A new touch this soon (ms, from the last lift) and this near (of the
# width; 6.27% is 140 units, some 80 px) is a tremor's second strike: dropped.
repeat_ms = 300
repeat_radius = 6.27%
# A palm: a contact this large or this hard, or this many contacts at once.
# 73.33% is size 11 of 15, 39.21% pressure 100 of 255. A finger is size 5,
# pressure ~48; a palm 12-15, 120-143.
palm_major = 73.33%
palm_pressure = 39.21%
palm_contacts = 3
# After a palm, the screen stays still this long once it is lifted (ms).
palm_grace_ms = 300
# A tap buzzes the motor this long (ms): the tap feedback for every
# program. 0: no buzz. Pulses under about 50 ms are not felt.
buzz_ms = 70
# A touch that moves farther than this (of the width; 3.58% is 80 units,
# some 46 px) is a scroll or a drag and does not buzz.
tap_radius = 3.58%
# A finger held still this long (ms) buzzes once then: a long press.
long_ms = 600
# A second finger while the first is down: a gesture (a pinch, a scroll
# with two fingers), every finger then going through at once. 0: one
# finger at a time, a second one ignored (for a hand that trembles).
multitouch = 1
